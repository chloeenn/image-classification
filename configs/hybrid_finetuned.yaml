name: hybrid_finetuned
phase: hybrid
model: resnet18
pretrained: false
source_run: resnet_ft_adam_lr0.0001_bs64_cosine_e10_s{seed}
seed: 42
res: 224
norm: imagenet
heads: [logreg, xgboost]
logreg_c: [0.01, 0.1, 1, 10]
max_iter: 1000
xgb_grid:
  max_depth: [4, 6, 8]
  learning_rate: [0.05, 0.1]
xgb_device: cpu
xgb_rounds: 300
xgb_patience: 20
